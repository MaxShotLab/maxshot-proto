syntax = "proto3";

package maxshot.provider_sync.v1;

import "maxshot/common/v1/types.proto";

option go_package = "github.com/MaxShotLab/maxshot-proto/gen/go/maxshot/provider_sync/v1;providersyncv1";

// ProviderSyncService is hosted by Provider Backend and called by Gateway Backend
// (Go gateway-dataplane, TS billing-account-service, TS studio-service/worker, and TS finance-worker)
// over WireGuard + TLS + HMAC.
// WatchSyncEvents streams lightweight version notifications only; snapshots and credentials are pulled idempotently by version.
service ProviderSyncService {
  // WatchSyncEvents streams lightweight catalog/credential version notifications and heartbeats.
  rpc WatchSyncEvents(WatchSyncEventsRequest) returns (stream WatchSyncEventsResponse);

  // ReportNodeSyncState reports each Gateway node's currently applied catalog and credential revisions for ADM-R07 freshness monitoring.
  rpc ReportNodeSyncState(ReportNodeSyncStateRequest) returns (ReportNodeSyncStateResponse);

  // GetCatalogSnapshot fetches a specific or latest immutable catalog snapshot.
  rpc GetCatalogSnapshot(GetCatalogSnapshotRequest) returns (GetCatalogSnapshotResponse);

  // StreamCatalogSnapshotChunks streams a serialized CatalogSnapshot in bounded chunks when snapshot size exceeds 4 MiB.
  rpc StreamCatalogSnapshotChunks(StreamCatalogSnapshotChunksRequest) returns (stream StreamCatalogSnapshotChunksResponse);

  // SyncGatewayPublicKeys registers Gateway active/retiring public keys used by Provider Backend for upstream secret envelope encryption.
  rpc SyncGatewayPublicKeys(SyncGatewayPublicKeysRequest) returns (SyncGatewayPublicKeysResponse);

  // SyncEncryptedCredentials pulls active and revoked upstream credentials encrypted with Gateway's public key.
  rpc SyncEncryptedCredentials(SyncEncryptedCredentialsRequest) returns (SyncEncryptedCredentialsResponse);

  // ReportOfferingMetrics pushes 1-5m aggregated Uptime, latency histograms, error classes, metering completeness, and payable totals.
  rpc ReportOfferingMetrics(ReportOfferingMetricsRequest) returns (ReportOfferingMetricsResponse);

  // SyncProviderStatements pushes billing-period payable statements, invoice corrections, and dispute records from Gateway Finance to Provider Backend.
  rpc SyncProviderStatements(SyncProviderStatementsRequest) returns (SyncProviderStatementsResponse);
}

// GatewayReconciliationService is hosted by Gateway Billing / Finance and called on demand by Provider Backend
// during invoice verification or dispute investigation/adjustment (PRV-R14 / ADM-R17 / ADM-R18) without duplicating raw attempt streams.
service GatewayReconciliationService {
  // ListOfferingAttemptRecords queries content-free, authoritative attempt settlement records by window, offering, or request ID.
  rpc ListOfferingAttemptRecords(ListOfferingAttemptRecordsRequest) returns (ListOfferingAttemptRecordsResponse);

  // ApplyProviderDisputeAdjustment writes operator-confirmed invoice corrections or disputes from Provider Portal
  // into Gateway Finance's discrepancy ledger (ADM-R17 / ADM-R18).
  rpc ApplyProviderDisputeAdjustment(ApplyProviderDisputeAdjustmentRequest) returns (ApplyProviderDisputeAdjustmentResponse);
}

enum RouteType {
  ROUTE_TYPE_UNSPECIFIED = 0;
  ROUTE_TYPE_DIRECT = 1;
  ROUTE_TYPE_AGGREGATOR = 2;
}

enum AdmissionStatus {
  ADMISSION_STATUS_UNSPECIFIED = 0;
  ADMISSION_STATUS_PENDING = 1;
  ADMISSION_STATUS_PASSED = 2;
  ADMISSION_STATUS_FAILED = 3;
}

enum AvailabilityStatus {
  AVAILABILITY_STATUS_UNSPECIFIED = 0;
  AVAILABILITY_STATUS_AVAILABLE = 1;
  AVAILABILITY_STATUS_PAUSED = 2;
  AVAILABILITY_STATUS_UNHEALTHY = 3;
  AVAILABILITY_STATUS_PENDING_REVIEW = 4; // PRV-R28: auto-paused on price/version/capability/policy change
}

enum AutoTaskLabel {
  AUTO_TASK_LABEL_UNSPECIFIED = 0;
  AUTO_TASK_LABEL_ORDINARY_CHAT = 1;
  AUTO_TASK_LABEL_CODING = 2;
  AUTO_TASK_LABEL_COMPLEX_REASONING = 3;
}

enum SyncEventKind {
  SYNC_EVENT_KIND_UNSPECIFIED = 0;
  SYNC_EVENT_KIND_HEARTBEAT = 1;
  SYNC_EVENT_KIND_CATALOG_PUBLISHED = 2;
  SYNC_EVENT_KIND_CREDENTIALS_UPDATED = 3;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
}

enum PublicKeyAlgorithm {
  PUBLIC_KEY_ALGORITHM_UNSPECIFIED = 0;
  PUBLIC_KEY_ALGORITHM_RSA_OAEP_SHA256 = 1;
  PUBLIC_KEY_ALGORITHM_X25519_HKDF_SHA256 = 2;
}

enum BillingComponentKind {
  BILLING_COMPONENT_KIND_UNSPECIFIED = 0;
  BILLING_COMPONENT_KIND_INPUT_TOKENS = 1;
  BILLING_COMPONENT_KIND_OUTPUT_TOKENS = 2;
  BILLING_COMPONENT_KIND_CACHE_READ_TOKENS = 3;
  BILLING_COMPONENT_KIND_CACHE_WRITE_TOKENS = 4;
  BILLING_COMPONENT_KIND_INTERNAL_REASONING_TOKENS = 5;
  BILLING_COMPONENT_KIND_INPUT_IMAGE = 6;
  BILLING_COMPONENT_KIND_INPUT_IMAGE_TOKENS = 7;
  BILLING_COMPONENT_KIND_INPUT_AUDIO_TOKENS = 8;
  BILLING_COMPONENT_KIND_INPUT_AUDIO_CACHE_READ_TOKENS = 9;
  BILLING_COMPONENT_KIND_WEB_SEARCH_CALLS = 10;
  BILLING_COMPONENT_KIND_OUTPUT_IMAGE = 11;
  BILLING_COMPONENT_KIND_OUTPUT_VIDEO = 12;
  BILLING_COMPONENT_KIND_MEDIA_EDIT_OP = 13;
  BILLING_COMPONENT_KIND_REQUEST_CALL = 14;
}

enum BillingUnit {
  BILLING_UNIT_UNSPECIFIED = 0;
  BILLING_UNIT_PER_TOKEN = 1;
  BILLING_UNIT_PER_1M_TOKENS = 2;
  BILLING_UNIT_PER_IMAGE = 3;
  BILLING_UNIT_PER_SECOND = 4;
  BILLING_UNIT_PER_MEGAPIXEL = 5;
  BILLING_UNIT_PER_MEGAPIXEL_SECOND = 6;
  BILLING_UNIT_PER_CHARACTER = 7;
  BILLING_UNIT_PER_SEARCH_UNIT = 8;
  BILLING_UNIT_PER_REQUEST = 9;
}

enum StatementEntryKind {
  STATEMENT_ENTRY_KIND_UNSPECIFIED = 0;
  STATEMENT_ENTRY_KIND_BASE_SETTLEMENT = 1;
  STATEMENT_ENTRY_KIND_CORRECTION = 2;
  STATEMENT_ENTRY_KIND_DISPUTE_HOLD = 3;
  STATEMENT_ENTRY_KIND_DISPUTE_RESOLVED = 4;
}

enum MediaPricingFormulaKind {
  MEDIA_PRICING_FORMULA_KIND_UNSPECIFIED = 0;
  MEDIA_PRICING_FORMULA_KIND_FLAT_RATE_COMPONENTS = 1;
  MEDIA_PRICING_FORMULA_KIND_VIDEO_TOKENS = 2;           // ceil(width * height * duration * fps / divisor) * rate
  MEDIA_PRICING_FORMULA_KIND_MEGAPIXEL_SECONDS = 3;      // ceil(w*scale)*ceil(h*scale)*duration_ms / 1048576 / 1000 * rate
  MEDIA_PRICING_FORMULA_KIND_RESOLUTION_TOKEN_LOOKUP = 4; // fixed output tokens per resolution + billable reference inputs
}

message MediaResolutionPriceEntry {
  string resolution = 1;
  string size = 2;
  bool with_audio = 3;
  bool with_video_input = 4;
  int64 fixed_output_tokens = 5;
  string rate_per_unit_usd_dec = 6;
  string unit_name = 7;
}

message MediaPricingFormula {
  MediaPricingFormulaKind formula_kind = 1;
  int32 video_token_fps = 2;
  int32 video_token_divisor = 3;
  int32 free_reference_images = 4;
  int64 tokens_per_billable_reference_image = 5;
  repeated MediaResolutionPriceEntry resolution_entries = 6;
}

// RateCondition expresses long-context tiers, UTC time bands, or Studio media mode/resolution selectors.
message RateCondition {
  int64 min_prompt_tokens = 1; // applies when prompt_tokens > min_prompt_tokens (0 means unconditional)
  bool has_utc_window = 2;
  int32 utc_start_hhmm = 3;    // e.g. 0..2359
  int32 utc_end_hhmm = 4;
  repeated string utc_days = 5; // lowercase "monday".."sunday"
  repeated maxshot.common.v1.KeyValueAttribute media_attributes = 6; // e.g. resolution=1080p, has_audio=true, path=i2v, edit_tool=inpaint
}

// RateComponent uses exact non-negative decimal USD strings (PRV-R20 & server-core usdLexeme)
// so sub-micro per-token tariffs never suffer premature integer truncation.
message RateComponent {
  BillingComponentKind kind = 1;
  string sku = 2;
  string rate_usd_dec = 3; // exact decimal USD string per `unit`, e.g. "1.25" with PER_1M_TOKENS or "0.00000125" with PER_TOKEN
  BillingUnit unit = 4;
  RateCondition condition = 5;
}

message RateCard {
  string rate_card_version = 1;
  string currency = 2; // "USD"
  int64 effective_at_unix_ms = 3;
  repeated RateComponent base_components = 4;
  repeated RateComponent conditional_overrides = 5; // evaluated in source order
  string minimum_charge_usd_dec = 6;                // minimum USD charge per request/generation (e.g. "0.010000")
  MediaPricingFormula media_pricing_formula = 7;    // optional nonlinear Studio media pricing formula (decision 2A)
}

message ProviderRecord {
  string provider_id = 1;
  string display_name = 2;
  RouteType route_type = 3;
  string summary = 4;
  string brand_mark_url = 5;
  bool enabled = 6;
  repeated maxshot.common.v1.BudgetPeriodRule budget_periods = 7;
}

message CatalogDefinition {
  string catalog_id = 1; // e.g. catalog_text, catalog_image, catalog_video
  string display_name = 2;
  maxshot.common.v1.Modality modality = 3;
  bool enabled = 4;
}

message IntRange {
  int32 min = 1;
  int32 max = 2;
}

message MediaDefaultParameters {
  string aspect_ratio = 1;
  string resolution = 2;
  int32 duration_seconds = 3;
  bool generate_audio = 4;
  string size = 5;
}

message MediaInputConstraint {
  int32 min_count = 1;
  int32 max_count = 2;
  int32 min_width = 3;
  int32 max_width = 4;
  int32 min_height = 5;
  int32 max_height = 6;
  int64 max_pixels = 7;
  int64 max_bytes = 8;
  int64 min_duration_ms = 9;
  int64 max_duration_ms = 10;
  int64 max_total_duration_ms = 11;
  repeated string allowed_mime_types = 12;
  string min_aspect_ratio_dec = 13;
  string max_aspect_ratio_dec = 14;
}

message MediaProviderOptionDescriptor {
  string key = 1;
  string value_type = 2;
  bool required = 3;
  repeated string enum_values = 4;
  string min_dec = 5;
  string max_dec = 6;
  string default_value_json = 7;
}

message MediaModelCapabilitySpec {
  repeated string aspect_ratios = 1;
  repeated string resolutions = 2;
  repeated string supported_sizes = 3;
  repeated int32 durations_seconds = 4;
  int32 max_outputs = 5;
  bool supports_generate_audio = 6;
  MediaDefaultParameters defaults = 7;
  repeated string frame_image_roles = 8;
  repeated string supported_frame_role_combinations = 9;
  IntRange reference_image_count = 10;
  MediaInputConstraint image_input_constraint = 11;
  MediaInputConstraint video_input_constraint = 12;
  MediaInputConstraint audio_input_constraint = 13;
  repeated MediaProviderOptionDescriptor provider_options = 14;
}

message MediaSafetyPolicy {
  string policy_id = 1;
  string mode = 2; // e.g. "openai_moderation" | "allow_all"
  string credential_revision = 3;
  string video_frame_strategy = 4;
  bool fail_closed = 5;
}

message MandatoryReasoningPolicy {
  bool mandatory = 1;
  repeated string supported_efforts = 2;
  string default_effort = 3;
}

message ServerToolConfig {
  string tool_name = 1;
  bool enabled = 2;
  string price_per_call_usd_dec = 3;
  int32 default_max_results = 4;
  int32 hard_max_results = 5;
}

message MediaOfferingSpec {
  string clarity_parameter = 1; // "resolution" | "quality"
  repeated string output_hostname_suffixes = 2; // SSRF guard for upstream media result URLs
  string upstream_endpoint_kind = 3;
}

message CustomerModelRecord {
  string model_id = 1;
  string display_name = 2;
  string description = 3;
  string verified_version = 4;
  maxshot.common.v1.Modality modality = 5;
  string catalog_id = 6;
  maxshot.common.v1.ModelTier tier = 7;
  int64 default_max_output_tokens = 8;
  repeated string model_aliases = 9;
  repeated string offering_ids = 10;
  repeated string input_modalities = 11;
  repeated string output_modalities = 12;
  MediaModelCapabilitySpec media_capability = 13;
  MediaSafetyPolicy media_safety_policy = 14;
}

// ObservedPerformanceSummary embeds 7-day rolling Maxshot-observed performance into CatalogSnapshot (PRV-R18, PRV-R34).
message ObservedPerformanceSummary {
  int64 window_start_unix_ms = 1;
  int64 window_end_unix_ms = 2;
  int64 dispatched_attempts = 3;
  bool sample_sufficient = 4;        // true only when dispatched_attempts >= configured minimum (PRV-R34)
  string delivered_success_pct_dec = 5; // e.g. "99.3", empty when !sample_sufficient
  bool is_first_token_metric = 6;    // true = first_token (streaming text), false = completion
  int64 latency_samples = 7;
  int64 p50_ms = 8;
  int64 p95_ms = 9;
}

message OfferingRecord {
  string offering_id = 1;
  string provider_id = 2;
  string model_id = 3;
  string variant_label = 4;
  string protocol_adapter = 5; // openai-compat | anthropic-native | google-native | openrouter-pinned | media-async
  string endpoint_url = 6;
  string native_model_id = 7;
  string verified_model_version = 8;
  string credential_id = 9;
  string credential_revision = 10;
  bool disable_upstream_fallback = 11;
  string pinned_upstream_provider = 12;
  bool require_serving_endpoint_proof = 13; // PRV-R10 upstream router verification
  AdmissionStatus admission_status = 14;
  AvailabilityStatus availability_status = 15;
  string unavailable_reason = 16;
  repeated string capabilities = 17;
  repeated string supported_parameters = 18;
  repeated string allowed_regions = 19;
  bool zero_retention = 20;
  string retention_label = 21;
  int64 context_tokens = 22;
  int64 max_input_tokens = 23;
  int64 max_output_tokens = 24;
  int64 ttft_timeout_ms = 25;
  int64 max_job_duration_seconds = 26;
  int64 grace_window_seconds = 27;          // PRV-R09 / BIL-R37: max_job_duration_seconds + grace_window_seconds < 86400
  int32 provider_cost_ceiling_bps = 28;     // e.g. 15000 = 1.5x customer rate ceiling (PRV-R21, PRV-R24)
  int32 health_backoff_failures = 29;       // PRV-R27 consecutive 5xx/timeout threshold
  int32 health_backoff_window_seconds = 30;
  int32 health_reprobe_seconds = 31;
  RateCard provider_cost_card = 32;
  RateCard customer_rate_card = 33;
  ObservedPerformanceSummary observed_performance = 34;
  maxshot.common.v1.CustomerChargeMode customer_charge_mode = 35;
  int32 hold_buffer_bps = 36;               // e.g. 11500 for 115% pre-hold buffer on provider_actual dynamic quotes
  string markup_multiplier_dec = 37;        // e.g. "1.000000" when customer_charge_mode == PROVIDER_ACTUAL_COST
  MandatoryReasoningPolicy mandatory_reasoning_policy = 38;
  repeated string omittable_parameters = 39; // unsupported sampling params (e.g. temperature, top_p) stripped silently (#154-4)
  repeated ServerToolConfig server_tools = 40;
  MediaOfferingSpec media_offering_spec = 41;
}

// TierGroupRecord carries Provider-computed Basic/Premium model tier groups
// referenced by subscription plan versions in Gateway Billing (subscription-plan-tiers.ts).
message TierGroupRecord {
  string group_id = 1;
  string display_name = 2;
  maxshot.common.v1.Modality modality = 3;
  maxshot.common.v1.ModelTier target_tier = 4; // BASIC or PREMIUM
  repeated string member_model_ids = 5;
  int32 auto_publish_max_change_pct = 6; // default 25% safety valve (decision 5A)
  repeated string source_group_ids = 7;
  repeated string fixed_model_ids = 8;
  repeated string excluded_model_ids = 9;
}

message SourceGroupRecord {
  string group_id = 1;
  string display_name = 2;
  maxshot.common.v1.Modality modality = 3;
  repeated string member_customer_model_ids = 4;
  repeated string fixed_model_ids = 5;
  repeated string excluded_model_ids = 6;
  string auto_match_rule_json = 7;
  string version = 8;
}

message ModelTierOverrideRecord {
  string customer_model_id = 1;
  maxshot.common.v1.Modality modality = 2;
  maxshot.common.v1.ModelTier override_tier = 3;
  string reason = 4;
  int64 updated_at_unix_ms = 5;
}

message CuratedModelItem {
  string model_id = 1;
  int32 rank = 2;
  bool recommended = 3;
  string badge_label = 4;
  repeated string tags = 5;
}

message CurationConfig {
  string chat_default_model_id = 1;
  repeated CuratedModelItem chat_models = 2;
  string studio_image_default_model_id = 3;
  repeated CuratedModelItem studio_image_models = 4;
  string studio_video_default_model_id = 5;
  repeated CuratedModelItem studio_video_models = 6;
}

message AutoPoolEntry {
  string offering_id = 1;
  string model_id = 2;
  repeated AutoTaskLabel task_labels = 3;
  int32 priority_rank = 4;
  int64 per_message_ceiling_micro_usd = 5;
}

message BudgetPolicy {
  repeated maxshot.common.v1.BudgetPeriodRule platform_periods = 1;
  repeated maxshot.common.v1.BudgetPeriodRule default_supplier_periods = 2;
  repeated maxshot.common.v1.BudgetPeriodRule business_total_periods = 3;
  repeated maxshot.common.v1.BudgetPeriodRule business_chat_periods = 4;
  repeated maxshot.common.v1.BudgetPeriodRule business_studio_periods = 5;
}

message CatalogSnapshot {
  string catalog_version = 1;
  int64 generated_at_unix_ms = 2;
  repeated CatalogDefinition catalogs = 3;
  repeated ProviderRecord providers = 4;
  repeated CustomerModelRecord models = 5;
  repeated OfferingRecord offerings = 6;
  repeated TierGroupRecord tier_groups = 7;
  CurationConfig curation = 8;
  repeated AutoPoolEntry auto_pool = 9;
  BudgetPolicy budget_policy = 10;
  repeated SourceGroupRecord source_groups = 11;
  repeated ModelTierOverrideRecord model_tier_overrides = 12;
}

message WatchSyncEventsRequest {
  string gateway_node_id = 1;
  string node_role = 2; // "dataplane" | "billing" | "studio" | "finance"
  string last_seen_catalog_version = 3;
  string last_seen_credential_revision = 4;
}

message WatchSyncEventsResponse {
  SyncEventKind event_kind = 1;
  string latest_catalog_version = 2;
  string latest_credential_revision = 3;
  int64 published_at_unix_ms = 4;
}

message ReportNodeSyncStateRequest {
  string gateway_node_id = 1;
  string node_role = 2;
  string applied_catalog_version = 3;
  string applied_credential_revision = 4;
  int64 reported_at_unix_ms = 5;
}

message ReportNodeSyncStateResponse {
  bool acknowledged = 1;
}

message GetCatalogSnapshotRequest {
  string catalog_version = 1; // empty means latest published snapshot
}

message GetCatalogSnapshotResponse {
  CatalogSnapshot snapshot = 1;
}

message StreamCatalogSnapshotChunksRequest {
  string catalog_version = 1;
  int32 max_chunk_bytes = 2; // defaults to 1 MiB when <= 0
}

message StreamCatalogSnapshotChunksResponse {
  string catalog_version = 1;
  int32 chunk_index = 2;
  int32 total_chunks = 3;
  string full_sha256_hex = 4;
  bytes serialized_snapshot_chunk = 5;
}

message GatewayPublicKeyItem {
  string gateway_public_key_id = 1;
  PublicKeyAlgorithm algorithm = 2;
  bytes public_key_der = 3;
  bool active_for_new_encryption = 4;
  int64 created_at_unix_ms = 5;
}

message SyncGatewayPublicKeysRequest {
  repeated GatewayPublicKeyItem keys = 1;
}

message SyncGatewayPublicKeysResponse {
  bool accepted = 1;
  string active_gateway_public_key_id = 2;
}

message EncryptedCredentialItem {
  string credential_id = 1;
  string credential_revision = 2;
  string provider_id = 3;
  CredentialStatus status = 4;
  string gateway_public_key_id = 5;
  bytes encrypted_dek = 6; // DEK encrypted with Gateway public key
  bytes nonce = 7;         // AES-256-GCM 12-byte nonce
  bytes ciphertext = 8;    // AES-256-GCM encrypted upstream secret + auth tag (empty when REVOKED)
  int64 updated_at_unix_ms = 9;
  repeated string target_node_roles = 10; // e.g. ["dataplane", "studio", "finance"]
}

message SyncEncryptedCredentialsRequest {
  string since_revision = 1;
}

message SyncEncryptedCredentialsResponse {
  string current_revision = 1;
  repeated EncryptedCredentialItem credentials = 2;
}

message LatencyHistogramBucket {
  int64 upper_bound_ms = 1;
  int64 sample_count = 2;
}

message OfferingWindowMetric {
  string offering_id = 1;
  int64 window_start_unix_ms = 2;
  int64 window_end_unix_ms = 3;
  int64 dispatched_attempts = 4;
  int64 delivered_success_count = 5;
  int64 http_429_count = 6;
  int64 http_5xx_count = 7;
  int64 timeout_count = 8;
  int64 mid_stream_or_malformed_count = 9;
  int64 user_input_error_count = 10;    // PRV-R35: excluded from delivered-success denominator
  int64 customer_cancelled_count = 11;  // PRV-R35: excluded from delivered-success denominator
  int64 terminal_attempts = 12;
  int64 verified_usage_attempts = 13;   // PRV-R35: metering completeness numerator
  int64 missing_usage_count = 14;
  bool is_first_token_metric = 15;
  int64 latency_sample_count = 16;
  int64 p50_latency_ms = 17;
  int64 p95_latency_ms = 18;
  repeated LatencyHistogramBucket latency_histogram = 19; // mergeable into exact 7-day rolling p50/p95
  int64 settled_provider_payable_micro_usd = 20;
  int64 discrepancy_micro_usd = 21;
}

message ReportOfferingMetricsRequest {
  string batch_id = 1;
  string gateway_node_id = 2;
  repeated OfferingWindowMetric metrics = 3;
}

message ReportOfferingMetricsResponse {
  bool accepted = 1;
}

message ProviderStatementEntry {
  string entry_id = 1; // append-only ID (PRV-R14 / ADM-R17)
  string statement_id = 2;
  string provider_id = 3;
  string offering_id = 4;
  StatementEntryKind kind = 5;
  string linked_entry_id = 6; // references prior entry for corrections/disputes
  string linked_request_id = 7;
  int64 period_start_unix_ms = 8;
  int64 period_end_unix_ms = 9;
  int64 attempt_count = 10;
  int64 amount_micro_usd = 11; // signed adjustment for corrections/disputes
  string actor_id = 12;
  string reason = 13;
  int64 created_at_unix_ms = 14;
}

message SyncProviderStatementsRequest {
  string batch_id = 1;
  repeated ProviderStatementEntry entries = 2;
}

message SyncProviderStatementsResponse {
  bool accepted = 1;
}

message AttemptSettlementRecord {
  string attempt_id = 1;
  string request_id = 2;
  string provider_id = 3;
  string offering_id = 4;
  string native_request_id = 5;
  string reported_serving_endpoint = 6;
  string status = 7;
  string error_class = 8;
  string provider_rate_card_version = 9;
  string customer_rate_card_version = 10;
  repeated maxshot.common.v1.KeyValueAttribute verified_usage_units = 11;
  string provider_cost_usd_dec = 12;
  int64 provider_cost_micro_usd = 13;
  int64 customer_charge_micro_usd = 14;
  int64 discrepancy_micro_usd = 15;
  int64 dispatched_at_unix_ms = 16;
  int64 completed_at_unix_ms = 17;
  int32 attempt_number = 18;
  string provider_generation_id = 19;
  int32 http_status = 20;
}

message ListOfferingAttemptRecordsRequest {
  string provider_id = 1;
  string offering_id = 2;
  string request_id = 3;
  string native_request_id = 4;
  int64 start_unix_ms = 5;
  int64 end_unix_ms = 6;
  bool discrepancy_only = 7;
  maxshot.common.v1.CursorPageRequest page = 8;
}

message ListOfferingAttemptRecordsResponse {
  repeated AttemptSettlementRecord records = 1;
  maxshot.common.v1.CursorPageResponse page = 2;
}

message ApplyProviderDisputeAdjustmentRequest {
  string adjustment_id = 1; // idempotency key for dispute adjustment
  string statement_id = 2;
  string provider_id = 3;
  string offering_id = 4;
  string period_start_date = 5; // YYYY-MM-DD
  string period_end_date = 6;   // YYYY-MM-DD
  string invoiced_cost_usd_dec = 7;
  string adjustment_delta_usd_dec = 8; // signed decimal USD delta written to discrepancy ledger
  string resolution_status = 9;        // "disputed" | "adjusted" | "resolved"
  string reason = 10;
  string operator_id = 11;
  int64 resolved_at_unix_ms = 12;
}

message ApplyProviderDisputeAdjustmentResponse {
  bool applied = 1;
  string discrepancy_ledger_entry_id = 2;
  string updated_statement_status = 3;
}
