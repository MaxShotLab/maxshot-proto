syntax = "proto3";

package maxshot.common.v1;

option go_package = "github.com/MaxShotLab/maxshot-proto/gen/go/maxshot/common/v1;commonv1";

// Modality enumerates supported inference and generation modalities across Provider, Gateway, and Studio.
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_TEXT = 1;
  MODALITY_IMAGE = 2;
  MODALITY_VIDEO = 3;
  MODALITY_EMBEDDING = 4;
  MODALITY_RERANK = 5;
  MODALITY_AUDIO = 6;
}

// ModelTier represents the model classification tier published by Provider Backend
// for subscription tier-group management and free-model quota policy.
enum ModelTier {
  MODEL_TIER_UNSPECIFIED = 0;
  MODEL_TIER_BASIC = 1;
  MODEL_TIER_PREMIUM = 2;
  MODEL_TIER_FREE = 3; // Web Chat F-labeled model: $0 within free quota, then falls back to 6-bucket charging
}

// FundingBucket enumerates customer funding sources in deterministic consumption order (BIL-R08).
enum FundingBucket {
  FUNDING_BUCKET_UNSPECIFIED = 0;
  FUNDING_BUCKET_FREE_MODEL_QUOTA = 1;  // $0 quota slot for F-labeled models before regular 6-bucket fallback
  FUNDING_BUCKET_AIT_EARNED = 2;        // 1st paid/earned bucket: 7-day expiring staking grants (earliest expiry first)
  FUNDING_BUCKET_BASIC_ALLOWANCE = 3;   // 2nd bucket: subscription Basic pool
  FUNDING_BUCKET_PREMIUM_ALLOWANCE = 4; // 3rd bucket: subscription shared Premium pool (including allow_basic_to_premium)
  FUNDING_BUCKET_FREE_CREDIT = 5;       // 4th bucket: promotional Free Credits
  FUNDING_BUCKET_REFERRAL_CREDIT = 6;   // 5th bucket: Maxshot Referral Credits
  FUNDING_BUCKET_DOLLAR_BALANCE = 7;    // 6th bucket: user-funded USD balance
}

// KeyFundingStrategy defines how a scoped API key selects funding buckets.
// - SUBSCRIPTION_FIRST: uses AIT Earned (when allow_ait_earned_credit=true), then Basic/Premium allowances;
//   when an active subscription exists on the account and dollar_relay_enabled=false, blocks all non-subscription
//   PAYG buckets (Free, Referral, Dollar). When no active subscription exists (#154 fallback), runtime treats
//   PAYG fallback as permitted so Free/Referral/Dollar keys remain usable unless explicitly locked.
// - PAYG: skips subscription allowances; uses AIT Earned (when allow_ait_earned_credit=true), then Free -> Referral -> Dollar.
enum KeyFundingStrategy {
  KEY_FUNDING_STRATEGY_UNSPECIFIED = 0;
  KEY_FUNDING_STRATEGY_SUBSCRIPTION_FIRST = 1;
  KEY_FUNDING_STRATEGY_PAYG = 2;
}

// SearchPolicy defines how web-search requests interact with active subscription pools (plan-qualification.ts).
enum SearchPolicy {
  SEARCH_POLICY_UNSPECIFIED = 0;
  SEARCH_POLICY_BASIC = 1;           // Search requests may consume Basic or Premium subscription pools
  SEARCH_POLICY_PREMIUM_ONLY = 2;    // Search requests may consume Premium subscription pool only
  SEARCH_POLICY_NO_SUBSCRIPTION = 3; // Search requests cannot consume subscription pools (must use AIT/Free/Referral/Dollar)
}

// CustomerChargeMode governs whether customer billing uses published rate-card formulas
// or verified provider-reported cost with optional markup (decision 4A).
enum CustomerChargeMode {
  CUSTOMER_CHARGE_MODE_UNSPECIFIED = 0;
  CUSTOMER_CHARGE_MODE_RATE_CARD_FORMULA = 1;    // Default: deterministic verified_usage * CustomerRateCard
  CUSTOMER_CHARGE_MODE_PROVIDER_ACTUAL_COST = 2; // Bills provider_reported_customer_base_cost * markup_multiplier_dec
}

// BudgetPeriodKind enumerates spend-cap window types (matching scoped-configuration.ts).
enum BudgetPeriodKind {
  BUDGET_PERIOD_KIND_UNSPECIFIED = 0;
  BUDGET_PERIOD_KIND_DAY = 1;
  BUDGET_PERIOD_KIND_MONTH = 2;
  BUDGET_PERIOD_KIND_FIXED = 3;
}

// RejectCode enumerates deterministic pre-dispatch rejection reasons (BIL-R24 / AGT-R05 / server-core).
enum RejectCode {
  REJECT_CODE_UNSPECIFIED = 0;
  REJECT_CODE_KEY_INVALID = 1;
  REJECT_CODE_KEY_REVOKED = 2;
  REJECT_CODE_KEY_EXPIRED = 3;
  REJECT_CODE_CATALOG_NOT_ALLOWED = 4;
  REJECT_CODE_MODEL_NOT_ALLOWED = 5;
  REJECT_CODE_MODEL_UNAVAILABLE = 6;
  REJECT_CODE_PINNED_OFFERING_INELIGIBLE = 7;
  REJECT_CODE_OVER_REQUEST_CEILING = 8;
  REJECT_CODE_OVER_DAILY_BUDGET = 9;
  REJECT_CODE_OVER_MONTHLY_BUDGET = 10;
  REJECT_CODE_OVER_SUPPLIER_BUDGET = 11;
  REJECT_CODE_OVER_PLATFORM_BUDGET = 12;
  REJECT_CODE_OVER_BUSINESS_BUDGET = 13;
  REJECT_CODE_INSUFFICIENT_FUNDING = 14;
  REJECT_CODE_DOLLAR_NOT_AUTHORIZED = 15;
  REJECT_CODE_JOB_LIMIT_EXCEEDED = 16;
  REJECT_CODE_IDEMPOTENCY_MISMATCH = 17;
  REJECT_CODE_ACCOUNT_INACTIVE = 18;
  REJECT_CODE_SPENDING_LOCKED = 19;
  REJECT_CODE_POLICY_INELIGIBLE = 20;
  REJECT_CODE_UNSUPPORTED_CAPABILITY = 21;
  REJECT_CODE_CONTEXT_LIMIT_EXCEEDED = 22;
  REJECT_CODE_OUTPUT_LIMIT_EXCEEDED = 23;
  REJECT_CODE_OVER_ACCOUNT_DAILY_BUDGET = 24;
  REJECT_CODE_OVER_ACCOUNT_MONTHLY_BUDGET = 25;
  REJECT_CODE_DOLLAR_CONFIRMATION_REQUIRED = 26;
  REJECT_CODE_RATE_LIMIT_EXCEEDED = 27;
  REJECT_CODE_CONCURRENT_STREAM_LIMIT_EXCEEDED = 28;
  REJECT_CODE_QUOTE_EXPIRED = 29;
  REJECT_CODE_QUOTE_MISMATCH = 30;
  REJECT_CODE_SAFETY_REJECTED = 31;
  REJECT_CODE_AUDIO_TOGGLE_NOT_SUPPORTED = 32;
  REJECT_CODE_REFERENCE_MEDIA_INVALID = 33;
  REJECT_CODE_AIT_COVERAGE_THROTTLED = 34;
}

// KeyValueAttribute replaces protobuf map<string, string> so Go and TypeScript
// always produce byte-for-byte identical wire encodings under HMAC verification.
message KeyValueAttribute {
  string key = 1;
  string value = 2;
}

// BudgetPeriodRule defines one daily, monthly, or non-overlapping fixed-window spend limit in micro-USD.
message BudgetPeriodRule {
  BudgetPeriodKind kind = 1;
  int64 limit_micro_usd = 2;
  string period_key = 3; // required when kind == BUDGET_PERIOD_KIND_FIXED
  int64 starts_at_unix_ms = 4;
  int64 ends_at_unix_ms = 5;
}

// CursorPageRequest provides cursor-based pagination for incremental cross-repo sync.
message CursorPageRequest {
  string cursor = 1;
  int32 limit = 2;
}

// CursorPageResponse carries the continuation cursor for incremental sync.
message CursorPageResponse {
  string next_cursor = 1;
  bool has_more = 2;
}
