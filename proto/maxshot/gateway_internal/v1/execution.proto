  int64 dollar_debit_micro_usd = 5;
  int64 period_start_unix_ms = 6;
  int64 period_end_unix_ms = 7;
  int64 paid_at_unix_ms = 8;
  string status = 9;
  string currency = 10;
}
message ListSubscriptionPlansRequest {}
message ListSubscriptionPlansResponse {
