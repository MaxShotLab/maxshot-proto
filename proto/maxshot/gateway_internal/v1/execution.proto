  bool replace_spending_limits = 4;
}
message UpdateAccountSettingsResponse {
  AccountFundingSettings settings = 1;
}

message SubscriptionPlanVersion {
  string plan_id = 1;
  string version_id = 2;
  string sales_status = 3;
  bool is_mock_commercial = 4;
  int64 price_cents = 5;
  string currency = 6;
  // UTF-8 PRD PlanVersionConfig JSON. The owner parses exact integers and rejects unknown fields.
  bytes policy_json = 7;
}
message AccountSubscription {
  string subscription_id = 1;
  string status = 2;
  SubscriptionPlanVersion current_plan = 3;
  string period_id = 4;
  int64 period_start_unix_ms = 5;
  int64 period_end_unix_ms = 6;
  bool auto_renew = 7;
  string pending_plan_version_id = 8;
  int32 anchor_day_of_month = 9;
  repeated BucketBalanceView remaining_pools = 10;
  repeated FundingWindowStatus windows = 11;
}
message SubscriptionInvoice {
  string invoice_id = 1;
  string plan_version_id = 2;
  string period_id = 3;
