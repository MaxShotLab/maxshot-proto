  string hold_id = 2;
  string decision = 3;
}
message ResolveDepositReorgHoldResponse {
  AdminMutationResult result = 1;
}
message ReviewTopupRequest {
  OperatorContext operator = 1;
  string order_id = 2;
  string decision = 3;
  string evidence_ref = 4;
}
message ReviewTopupResponse {
  AdminMutationResult result = 1;
}
message RevokeReferralRewardRequest {
