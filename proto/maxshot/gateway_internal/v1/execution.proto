syntax = "proto3";

package maxshot.gateway_internal.v1;

import "maxshot/common/v1/types.proto";
import "maxshot/contract_grant/v1/contract_grant.proto";

option go_package = "github.com/MaxShotLab/maxshot-proto/gen/go/maxshot/gateway_internal/v1;gatewayinternalv1";

// BillingExecutionService is the intra-datacenter execution and ledger contract hosted by Go billing-service.
service BillingExecutionService {
  // ResolvePrincipalScope authenticates an API key or account principal and returns catalog/model/plan/rate-limit scopes
  // so Go gateway-dataplane can serve viewer-filtered /v1/models and enforce Redis concurrency/RPM/TPM limits (AGT-R03) without connecting to PostgreSQL.
  rpc ResolvePrincipalScope(ResolvePrincipalScopeRequest) returns (ResolvePrincipalScopeResponse);

  // EvaluateCatalogDiscovery evaluates viewer-specific model eligibility, search eligibility, and funding summary
  // for /v1/discovery/models without connecting to PostgreSQL from gateway-dataplane (decision 6A).
  rpc EvaluateCatalogDiscovery(EvaluateCatalogDiscoveryRequest) returns (EvaluateCatalogDiscoveryResponse);

  // PreviewQuote computes a side-effect-free pre-submit estimate, hard maximum, bucket breakdown,
  // F-model free-quota fallback status, Studio Dollar confirmation requirement, optional 5-minute quote lock,
  // and full /me/funding-estimate window/pool details (BIL-R21..R23, decision 3A).
  rpc PreviewQuote(PreviewQuoteRequest) returns (PreviewQuoteResponse);

  // AuthorizeAndHold performs zero-trust rate/tier recomputation, idempotency check, budget & video-concurrency checks,
  // optional locked quote verification, and atomic multi-bucket hold before any upstream dispatch (BIL-R24, BIL-R25).
  rpc AuthorizeAndHold(AuthorizeAndHoldRequest) returns (AuthorizeAndHoldResponse);

  // MarkSending durably records an upstream dispatch attempt under the fenced lease before sending bytes.
  rpc MarkSending(MarkSendingRequest) returns (MarkSendingResponse);

  // ExtendExecutionLease renews an active execution lease for long-running streaming or async Studio media jobs.
  rpc ExtendExecutionLease(ExtendExecutionLeaseRequest) returns (ExtendExecutionLeaseResponse);

  // Settle finalizes verified text or media usage once, supports double-authorized Dollar shortfall top-up,
  // records platform/provider discrepancies, or parks missing-usage requests until the persisted customer release deadline.
  rpc Settle(SettleRequest) returns (SettleResponse);

  // MarkUncertain moves an accepted async media job that exceeded max_job_duration + grace into the ADM-R16 uncertain queue.
  rpc MarkUncertain(MarkUncertainRequest) returns (MarkUncertainResponse);

  // ResolveUncertain resolves an uncertain or pending-reconciliation hold via operator action (ADM-R16) or the persisted automatic release deadline.
  rpc ResolveUncertain(ResolveUncertainRequest) returns (ResolveUncertainResponse);

  // A durable, fenced observation written as soon as the upstream status or identifiers are known.
  rpc RecordAttemptObservation(RecordAttemptObservationRequest) returns (RecordAttemptObservationResponse);

  // Claims expired execution work without authorizing a new upstream dispatch.
  rpc ClaimExecutionRecovery(ClaimExecutionRecoveryRequest) returns (ClaimExecutionRecoveryResponse);

  // Reports the active, durably imported admission snapshot on the authoritative billing instance.
  rpc GetBillingCatalogState(GetBillingCatalogStateRequest) returns (GetBillingCatalogStateResponse);
}

enum ExecutionChannel {
  EXECUTION_CHANNEL_UNSPECIFIED = 0;
  EXECUTION_CHANNEL_API = 1;
  EXECUTION_CHANNEL_WEB_CHAT = 2;
  EXECUTION_CHANNEL_STUDIO = 3;
}

enum RouteSelectionMode {
  ROUTE_SELECTION_MODE_UNSPECIFIED = 0;
  ROUTE_SELECTION_MODE_MODEL_AUTO_PROVIDER = 1; // customer chose modelId, Gateway picked lowest-cost offering
  ROUTE_SELECTION_MODE_MODEL_PINNED_OFFERING = 2; // customer pinned offeringId, zero fallback allowed
  ROUTE_SELECTION_MODE_AUTO_MODEL = 3; // customer chose maxshot/auto, converged to concrete modelId before hold
}

enum HoldDecisionStatus {
  HOLD_DECISION_STATUS_UNSPECIFIED = 0;
  HOLD_DECISION_STATUS_ADMITTED = 1;
  HOLD_DECISION_STATUS_REJECTED = 2;
  HOLD_DECISION_STATUS_IDEMPOTENT_IN_PROGRESS = 3;
  HOLD_DECISION_STATUS_IDEMPOTENT_COMPLETED = 4;
}

enum SettlementOutcome {
  SETTLEMENT_OUTCOME_UNSPECIFIED = 0;
  SETTLEMENT_OUTCOME_DELIVERED = 1;
  SETTLEMENT_OUTCOME_PARTIALLY_DELIVERED = 2; // Studio partial outputs / completed preprocessing (BIL-R33)
  SETTLEMENT_OUTCOME_NOT_ACCEPTED = 3;
  SETTLEMENT_OUTCOME_FAILED_BEFORE_OUTPUT = 4;
  SETTLEMENT_OUTCOME_CANCELLED = 5; // charges completed outputs/components, releases remainder
  SETTLEMENT_OUTCOME_PENDING_RECONCILIATION = 6; // missing final usage; the persisted release deadline applies
}

enum AttemptErrorClass {
  ATTEMPT_ERROR_CLASS_UNSPECIFIED = 0;
  ATTEMPT_ERROR_CLASS_NONE = 1;
  ATTEMPT_ERROR_CLASS_HTTP_429 = 2;
  ATTEMPT_ERROR_CLASS_HTTP_5XX = 3;
  ATTEMPT_ERROR_CLASS_TIMEOUT = 4;
  ATTEMPT_ERROR_CLASS_CONNECTION_ERROR = 5;
  ATTEMPT_ERROR_CLASS_MID_STREAM_FAILURE = 6;
  ATTEMPT_ERROR_CLASS_MALFORMED_OUTPUT = 7;
  ATTEMPT_ERROR_CLASS_USER_INPUT_4XX = 8;
  ATTEMPT_ERROR_CLASS_CONTENT_POLICY = 9;
  ATTEMPT_ERROR_CLASS_CLIENT_CANCELLED = 10;
}

enum UncertainResolutionAction {
  UNCERTAIN_RESOLUTION_ACTION_UNSPECIFIED = 0;
  UNCERTAIN_RESOLUTION_ACTION_SETTLE_DELIVERED = 1;
  UNCERTAIN_RESOLUTION_ACTION_RELEASE_LOST = 2;
  UNCERTAIN_RESOLUTION_ACTION_AUTO_RELEASE_24H = 3 [deprecated = true];
  UNCERTAIN_RESOLUTION_ACTION_AUTO_RELEASE_CUSTOMER_HOLD = 4;
}

// MediaPricingDimensions carries structured request/result dimensions so BillingExecutionService
// can deterministically recompute nonlinear Studio pricing rules from CatalogSnapshot (decision 2A).
message MediaPricingDimensions {
  string resolution = 1;
  string aspect_ratio = 2;
  string size = 3;
  int32 width_px = 4;
  int32 height_px = 5;
  int32 duration_seconds = 6;
  int64 duration_ms = 7;
  bool generate_audio = 8;
  int32 reference_image_count = 9;
  int32 reference_video_count = 10;
  int64 reference_video_total_duration_ms = 11;
  int32 upscale_factor = 12;
  int32 requested_outputs = 13;
}

// UsageBound unifies multi-dimensional LLM token bounds/meters and Studio/API media generation units.
message UsageBound {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_write_tokens = 4;
  int64 reasoning_tokens = 5;
  int64 input_images = 6;
  int64 input_image_tokens = 7;
  int64 input_audio_tokens = 8;
  int64 input_audio_cache_read_tokens = 9;
  bool has_input_audio = 10;
  int64 web_search_calls = 11;
  // Media & async generation dimensions
  int32 media_output_count = 12;
  int64 media_duration_seconds = 13;
  int32 media_width = 14;
  int32 media_height = 15;
  string media_megapixels_dec = 16;
  bool media_has_audio = 17;
  int64 media_character_count = 18;
  repeated maxshot.common.v1.KeyValueAttribute media_attributes = 19; // e.g. path=i2v, resolution=1080p, edit_tool=inpaint
  MediaPricingDimensions media_dimensions = 20;
}

message QuoteComponentLine {
  string item = 1;
  int64 estimated_credits = 2;
  int64 hard_max_credits = 3;
}

message BucketAllocationLine {
  maxshot.common.v1.FundingBucket bucket = 1;
  string source_id = 2; // grant_id or subscription_period_id
  int64 credits = 3;
  int64 dollar_micro_usd = 4;
  int64 expires_at_unix_ms = 5;
}

// SpendingLimitDiagnostic mirrors server-core SpendingLimitExceededDescription (never exposes supplier budgets).
message SpendingLimitDiagnostic {
  string scope = 1; // "account" | "api_key"
  maxshot.common.v1.BudgetPeriodKind period = 2;
  string unit = 3; // "credits" | "gross"
  int64 limit = 4;
  int64 used = 5;
  int64 pending_reserved = 6;
  int64 required_reserve = 7;
  int64 available = 8;
  int64 resets_at_unix_ms = 9;
  string reason = 10;
}

// CreditShortfallDiagnostic mirrors server-core CreditReservationContext.
message CreditShortfallDiagnostic {
  int64 required_reservation_credits = 1;
  int64 available_credits = 2;
  int64 short_credits = 3;
  repeated string funding_reasons = 4;
}

message ThresholdWarning {
  string warning_kind = 1; // "window_5h_90pct" | "window_weekly_90pct" | "basic_monthly_90pct" | "premium_monthly_90pct"
  int32 used_percent = 2;
  int64 resets_at_unix_ms = 3;
}

message LockedVersionSet {
  string catalog_version = 1;
  string primary_rate_card_version = 2;
  string backup_rate_card_version = 3;
  string plan_version = 4;
  string fx_version = 5;
}

message BucketBalanceView {
  maxshot.common.v1.FundingBucket bucket = 1;
  int64 available_micro_usd = 2;
  int64 held_micro_usd = 3;
  int64 available_credits = 4;
  int64 earliest_expires_at_unix_sec = 5;
}

message FundingWindowStatus {
  string window_kind = 1; // "5h" | "7d"
  int64 limit_micro_usd = 2;
  int64 used_micro_usd = 3;
  int64 held_micro_usd = 4;
  int64 remaining_micro_usd = 5;
  int64 resets_at_unix_sec = 6;
  bool applies_to_request = 7;
}

message KeyGrossWindowStatus {
  int64 daily_limit_micro_usd = 1;
  int64 daily_used_micro_usd = 2;
  int64 monthly_limit_micro_usd = 3;
  int64 monthly_used_micro_usd = 4;
}

message ResolvePrincipalScopeRequest {
  string api_key_sha256 = 1;
  string internal_account_id = 2;
  string client_region = 3;
}

message ResolvePrincipalScopeResponse {
  bool authenticated = 1;
  maxshot.common.v1.RejectCode reject_code = 2;
  string reject_message = 3;
  string account_id = 4;
  string api_key_id = 5;
  maxshot.common.v1.KeyFundingStrategy key_funding_strategy = 6;
  bool allow_ait_earned_credit = 7; // independent key toggle (default true)
  bool dollar_relay_enabled = 8; // when subscription active, false blocks Free + Referral + Dollar; #154 falls back when no active subscription
  bool allow_basic_to_premium = 9; // account setting "Continue with Premium when Basic is not enough"
  repeated string allowed_catalog_ids = 10;
  repeated string model_allowlist = 11;
  string active_plan_id = 12;
  repeated string plan_basic_group_ids = 13;
  repeated string plan_premium_group_ids = 14;
  int32 max_concurrent_streams = 15;
  int32 rpm_limit = 16;
  int64 tpm_limit = 17;
  bool spending_locked = 18;
  int64 key_expires_at_unix_ms = 19;
  maxshot.common.v1.SearchPolicy search_policy = 20;
  bool media_shares_subscription_windows = 21; // true under switched qualification policy (decision 5A)
  repeated string ait_coverage_throttled_model_ids = 22;
}

message EvaluateCatalogDiscoveryRequest {
  string account_id = 1;
  string key_id = 2;
  ExecutionChannel channel = 3;
  repeated string customer_model_ids = 4; // empty evaluates all published models in current CatalogSnapshot
}

message ModelDiscoveryEvaluation {
  string customer_model_id = 1;
  bool key_scope_allowed = 2;
  bool subscription_basic_eligible = 3;
  bool subscription_premium_eligible = 4;
  bool ait_earned_credit_eligible = 5;
  bool ait_coverage_throttled = 6;
  bool search_subscription_eligible = 7;
  repeated maxshot.common.v1.FundingBucket spendable_buckets = 8;
  maxshot.common.v1.RejectCode block_reason = 9;
}

message EvaluateCatalogDiscoveryResponse {
  string catalog_version = 1;
  string funding_scenario = 2;
  repeated BucketBalanceView bucket_balances = 3;
  repeated FundingWindowStatus windows = 4;
  KeyGrossWindowStatus key_gross_window = 5;
  repeated ModelDiscoveryEvaluation models = 6;
}

message PreviewQuoteRequest {
  string api_key_sha256 = 1;
  string internal_account_id = 2;
  ExecutionChannel channel = 3;
  maxshot.common.v1.Modality modality = 4;
  RouteSelectionMode selection_mode = 5;
  string model_id = 6;
  string catalog_version = 7;
  string primary_offering_id = 8;
  string backup_offering_id = 9;
  UsageBound estimate_bound = 10;
  UsageBound hard_max_bound = 11;
  int64 caller_ceiling_micro_usd = 12;
  bool zero_retention = 13;
  string client_region = 14;
  bool issue_quote_lock = 15; // true issues a 5-minute TTL locked quote_id for two-step Studio submission (BIL-R22)
  string request_hash = 16; // normalized generation parameter digest bound to quote_id
  string effective_channel = 17;
  // Trusted HTTP principal flows bind the quote to this canonical request fingerprint.
  string request_body_sha256 = 18;
}

message PreviewQuoteResponse {
  bool eligible = 1;
  maxshot.common.v1.RejectCode reject_code = 2;
  string reject_message = 3;
  int64 estimated_credits = 4;
  int64 hard_max_credits = 5;
  int64 hard_max_micro_usd = 6;
  bool uses_free_model_quota = 7;
  bool free_model_quota_exhausted_fallback = 8; // F-model free quota exhausted; quote reflects regular 6-bucket fallback
  bool requires_dollar_confirmation = 9; // Studio and applicable Web Chat flows must confirm the maximum Dollar debit
  int64 max_dollar_debit_micro_usd = 10;
  bool basic_to_premium_projected = 11;
  repeated QuoteComponentLine breakdown = 12;
  repeated BucketAllocationLine projected_hold_buckets = 13;
  SpendingLimitDiagnostic budget_diagnostic = 14;
  CreditShortfallDiagnostic credit_diagnostic = 15;
  string quote_id = 16;
  int64 quote_expires_at_unix_ms = 17;
  string catalog_version = 18;
  string rate_card_version = 19;
  int64 reserved_credits = 20;
  string funding_scenario = 21;
  repeated BucketBalanceView bucket_balances = 22;
  repeated FundingWindowStatus windows = 23;
  KeyGrossWindowStatus key_gross_window = 24;
  bool media_shares_subscription_windows = 25;
}

message AuthorizeAndHoldRequest {
  string trace_id = 1;
  string idempotency_scope = 2;
  string idempotency_key = 3;
  string request_body_sha256 = 4;
  string api_key_sha256 = 5; // populated when channel == EXECUTION_CHANNEL_API or API Studio
  string internal_account_id = 6; // populated when authenticated via Web session JWT
  ExecutionChannel channel = 7;
  maxshot.common.v1.Modality modality = 8;
  RouteSelectionMode selection_mode = 9;
  string requested_model_id = 10; // e.g. "maxshot/auto" or concrete model_id
  string model_id = 11; // resolved concrete customer model_id
  string auto_task_label = 12;
  string catalog_version = 13;
  string primary_offering_id = 14;
  string backup_offering_id = 15;
  UsageBound estimate_bound = 16;
  UsageBound hard_max_bound = 17;
  int64 caller_ceiling_micro_usd = 18;
  bool dollar_confirmed = 19;
  bool zero_retention = 20;
  string client_region = 21;
  string studio_operation_id = 22; // links Studio async job record (BIL-R41)
  int64 initial_lease_ttl_ms = 23;
  string quote_id = 24; // optional 5-minute locked quote from PreviewQuote
  string request_hash = 25; // verified against locked quote when quote_id is supplied
  maxshot.common.v1.CustomerChargeMode customer_charge_mode_override = 26;
  string effective_channel = 27;
}

message AuthorizeAndHoldResponse {
  HoldDecisionStatus status = 1;
  bool admitted = 2;
  maxshot.common.v1.RejectCode reject_code = 3;
  string reject_message = 4;
  string request_id = 5; // ULID, generated when admitted and returned on IDEMPOTENT_IN_PROGRESS/COMPLETED replays (BIL-R24, BIL-R36)
  string hold_id = 6;
  string lease_token = 7;
  int64 lease_expires_at_unix_ms = 8;
  int64 estimated_credits = 9;
  int64 hard_max_credits = 10;
  int64 computed_hard_max_micro_usd = 11;
  int64 provider_cost_ceiling_micro_usd = 12;
  bool uses_free_model_quota = 13;
  bool basic_to_premium_used = 14;
  LockedVersionSet locked_versions = 15;
  repeated BucketAllocationLine held_buckets = 16;
  repeated ThresholdWarning threshold_warnings = 17;
  SpendingLimitDiagnostic budget_diagnostic = 18;
  CreditShortfallDiagnostic credit_diagnostic = 19;
  SettleResponse cached_settlement = 20; // populated when status == HOLD_DECISION_STATUS_IDEMPOTENT_COMPLETED
  IdempotentHttpResponse cached_http_response = 21;
  UsageBound effective_primary_bound = 22;
  UsageBound effective_backup_bound = 23;
  optional int64 customer_release_at_unix_ms = 24;
  // Present when a confirmed Web request exceeds its locked Dollar maximum or needs a first confirmation.
  PreviewQuoteResponse replacement_quote = 25;
  repeated FundingNotice funding_notices = 26;
  optional int64 max_dollar_debit_micro_usd = 27;
}

message MarkSendingRequest {
  string request_id = 1;
  string attempt_id = 2;
  string offering_id = 3;
  string dispatch_key = 4;
  string lease_token = 5;
  int64 lease_ttl_ms = 6;
}

message MarkSendingResponse {
  bool accepted = 1;
  int64 lease_expires_at_unix_ms = 2;
  string reject_reason = 3;
  // True only for the transaction that created the dispatch intent. A retry after an ambiguous
  // RPC result never grants permission to send again, even when accepted is true.
  optional bool newly_authorized = 4;
  optional int64 dispatched_at_unix_ms = 5;
  // Reserved atomically for this attempt, including any backup after a definitive primary failure.
  optional int64 provider_cost_reserved_micro_usd = 6;
}

message ExtendExecutionLeaseRequest {
  string request_id = 1;
  string lease_token = 2;
  int64 extend_ttl_ms = 3;
}

message ExtendExecutionLeaseResponse {
  bool accepted = 1;
  int64 lease_expires_at_unix_ms = 2;
}

message MediaOutputSettlementItem {
  string output_id = 1;
  int32 output_index = 2;
  bool delivered = 3;
  int64 duration_ms = 4;
  bool has_audio = 5;
  int32 width = 6;
  int32 height = 7;
  string failure_code = 8;
}

message AttemptCostRecord {
  string attempt_id = 1;
  string offering_id = 2;
  string native_request_id = 3;
  string reported_serving_endpoint = 4; // PRV-R10 upstream router proof
  bool succeeded = 5;
  AttemptErrorClass error_class = 6;
  UsageBound usage = 7;
  string provider_reported_cost_usd_dec = 8;
  int64 dispatched_at_unix_ms = 9;
  int64 first_token_at_unix_ms = 10;
  int64 completed_at_unix_ms = 11;
  int32 attempt_number = 12;
  string provider_generation_id = 13; // OpenRouter gen-... or Ark async task ID
  int32 http_status = 14;
  optional AttemptDispatchState dispatch_state = 15;
  optional string dispatch_key = 16;
}

message SettleRequest {
  string request_id = 1;
  string settlement_idempotency_key = 2;
  string lease_token = 3;
  SettlementOutcome outcome = 4;
  string serving_offering_id = 5;
  string native_request_id = 6;
  string reported_serving_endpoint = 7;
  bool fallback_used = 8;
  string fallback_reason = 9;
  UsageBound verified_usage = 10;
  int64 estimated_streamed_output_tokens = 11; // audit evidence only when PENDING_RECONCILIATION (never billed as invented usage)
  repeated MediaOutputSettlementItem media_outputs = 12;
  repeated AttemptCostRecord attempts = 13;
  maxshot.common.v1.CustomerChargeMode customer_charge_mode = 14;
  string provider_reported_customer_base_cost_usd_dec = 15; // base cost when CUSTOMER_CHARGE_MODE_PROVIDER_ACTUAL_COST applies
  // Only bounded, non-streaming responses eligible for retention. Persist with final result or leave absent.
  IdempotentHttpResponse http_response = 16;
}

message SettleResponse {
  bool settled = 1;
  int64 final_customer_credits = 2;
  int64 final_customer_charge_micro_usd = 3;
  int64 released_hold_credits = 4;
  int64 released_hold_micro_usd = 5;
  int64 shortfall_top_up_micro_usd = 6; // extra unfrozen Dollar charged when double-authorized & not ceiling-capped
  int64 platform_borne_discrepancy_micro_usd = 7; // overrun or uncompensated shortfall routed to discrepancy ledger
  int64 settled_provider_payable_micro_usd = 8;
  int64 auto_release_at_unix_ms = 9; // persisted deadline when customer funds are still held
  repeated BucketAllocationLine settled_buckets = 10;
  repeated BucketAllocationLine released_buckets = 11;
  optional SettlementDisposition disposition = 12;
}

message MarkUncertainRequest {
  string request_id = 1;
  string studio_operation_id = 2;
  string lease_token = 3;
  string provider_task_id = 4;
  string reason = 5;
}

message MarkUncertainResponse {
  bool marked = 1;
  int64 auto_release_at_unix_ms = 2; // persisted Studio release deadline
}

message ResolveUncertainRequest {
  string request_id = 1;
  string resolution_idempotency_key = 2;
  UncertainResolutionAction action = 3;
  string actor_id = 4; // operator ID or "system:finance-worker" (ADM-R12)
  string reason = 5;
  string serving_offering_id = 6;
  string native_request_id = 7;
  UsageBound verified_usage = 8; // populated for Studio SETTLE_DELIVERED or text PENDING_RECONCILIATION recovery
  repeated MediaOutputSettlementItem media_outputs = 9;
  string late_provider_cost_usd_dec = 10; // recorded into discrepancy ledger if already auto-released (BIL-R36)
  string attempt_id = 11;
  string provider_generation_id = 12;
  string offering_id = 13;
  // Fenced recovery claim for automatic resolution. Operator paths use an operation-bound audit context.
  string recovery_lease_token = 14;
  OperatorContext operator = 15;
}

message ResolveUncertainResponse {
  bool resolved = 1;
  SettleResponse settlement = 2;
}

// Execution-side observations never imply permission to resend an upstream request.
enum AttemptDispatchState {
  ATTEMPT_DISPATCH_STATE_UNSPECIFIED = 0;
  ATTEMPT_DISPATCH_STATE_INTENT_RECORDED = 1;
  ATTEMPT_DISPATCH_STATE_NOT_ACCEPTED = 2;
  ATTEMPT_DISPATCH_STATE_FAILED_TERMINAL = 3;
  ATTEMPT_DISPATCH_STATE_ACCEPTED = 4;
  ATTEMPT_DISPATCH_STATE_UNKNOWN = 5;
  ATTEMPT_DISPATCH_STATE_COMPLETED = 6;
}

enum SettlementDisposition {
  SETTLEMENT_DISPOSITION_UNSPECIFIED = 0;
  SETTLEMENT_DISPOSITION_APPLIED = 1;
  SETTLEMENT_DISPOSITION_ALREADY_APPLIED = 2;
  SETTLEMENT_DISPOSITION_PENDING_RECONCILIATION = 3;
  SETTLEMENT_DISPOSITION_AFTER_CUSTOMER_RELEASE = 4;
  SETTLEMENT_DISPOSITION_LEASE_LOST = 5;
}

enum FundingNotice {
  FUNDING_NOTICE_UNSPECIFIED = 0;
  FUNDING_NOTICE_FREE_MODEL_QUOTA_EXHAUSTED = 1;
  FUNDING_NOTICE_AIT_COVERAGE_THROTTLED = 2;
}

message IdempotentHttpResponse {
  int32 status_code = 1;
  // Only allowlisted end-to-end headers. Regenerate tracing headers and never persist credentials.
  repeated maxshot.common.v1.KeyValueAttribute headers = 2;
  bytes body = 3; // Maximum 1 MiB. Never store SSE or zero-retention output.
}

message RecordAttemptObservationRequest {
  string request_id = 1;
  string lease_token = 2;
  string observation_idempotency_key = 3;
  AttemptCostRecord attempt = 4;
}

message RecordAttemptObservationResponse {
  bool recorded = 1;
  AttemptDispatchState dispatch_state = 2;
}

message ClaimExecutionRecoveryRequest {
  uint32 limit = 1;
}

message ExecutionRecoveryClaim {
  string request_id = 1;
  string studio_operation_id = 2;
  string lease_token = 3;
  int64 lease_expires_at_unix_ms = 4;
  int64 customer_release_at_unix_ms = 5;
  ExecutionChannel channel = 6;
  string locked_catalog_version = 7;
  repeated AttemptCostRecord attempts = 8;
  maxshot.common.v1.CustomerChargeMode customer_charge_mode = 9;
  bool customer_hold_released = 10;
}

message ClaimExecutionRecoveryResponse {
  repeated ExecutionRecoveryClaim claims = 1;
}

message GetBillingCatalogStateRequest {}

message GetBillingCatalogStateResponse {
  string active_catalog_version = 1;
  bool frozen_routing = 2;
  repeated string frozen_allowed_offering_ids = 3;
}

// All methods are internal. account_id is derived from the authenticated Web principal,
// never trusted from a public request body. Writes derive idempotency from the operation and its inputs.
service AccountManagementService {
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc UpdateApiKey(UpdateApiKeyRequest) returns (UpdateApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc GetAccountFunding(GetAccountFundingRequest) returns (GetAccountFundingResponse);
  rpc UpdateAccountSettings(UpdateAccountSettingsRequest) returns (UpdateAccountSettingsResponse);
  rpc ListSubscriptionPlans(ListSubscriptionPlansRequest) returns (ListSubscriptionPlansResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc PurchaseSubscription(PurchaseSubscriptionRequest) returns (PurchaseSubscriptionResponse);
  rpc RenewSubscription(RenewSubscriptionRequest) returns (RenewSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc SchedulePlanChange(SchedulePlanChangeRequest) returns (SchedulePlanChangeResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc GetDepositAddress(GetDepositAddressRequest) returns (GetDepositAddressResponse);
  rpc CreateTopupOrder(CreateTopupOrderRequest) returns (CreateTopupOrderResponse);
  rpc RecordStripePayment(RecordStripePaymentRequest) returns (RecordStripePaymentResponse);
  rpc ListTopups(ListTopupsRequest) returns (ListTopupsResponse);
  rpc LinkWallet(LinkWalletRequest) returns (LinkWalletResponse);
  rpc GetWalletLink(GetWalletLinkRequest) returns (GetWalletLinkResponse);
  rpc AcceptFundedTerm(AcceptFundedTermRequest) returns (AcceptFundedTermResponse);
  rpc GetCurrentFundedTerm(GetCurrentFundedTermRequest) returns (GetCurrentFundedTermResponse);
  rpc PrepareAccountMerge(PrepareAccountMergeRequest) returns (PrepareAccountMergeResponse);
  rpc CommitAccountMerge(CommitAccountMergeRequest) returns (CommitAccountMergeResponse);
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);
  rpc GetUsageDetail(GetUsageDetailRequest) returns (GetUsageDetailResponse);
  rpc ListAccountNotices(ListAccountNoticesRequest) returns (ListAccountNoticesResponse);
  rpc AckAccountNotice(AckAccountNoticeRequest) returns (AckAccountNoticeResponse);
  rpc GetReferralSummary(GetReferralSummaryRequest) returns (GetReferralSummaryResponse);
  rpc SetReferralAttribution(SetReferralAttributionRequest) returns (SetReferralAttributionResponse);
}

message RegisterAccountRequest {
  string registration_id = 1; // Stable BFF-owned identity provisioning reference, never an email or raw OAuth identifier.
}
message RegisterAccountResponse {
  string account_id = 1;
}

message ApiKeyPolicy {
  optional maxshot.common.v1.KeyFundingStrategy funding_strategy = 1;
  optional bool allow_ait_earned_credit = 2;
  optional bool dollar_relay_enabled = 3;
  repeated string allowed_catalog_ids = 4;
  repeated string model_allowlist = 5;
  optional int64 per_request_ceiling_micro_usd = 6;
  repeated maxshot.common.v1.BudgetPeriodRule spending_limits = 7;
  optional int64 expires_at_unix_ms = 8;
  optional int32 rpm_limit = 9;
  optional int64 tpm_limit = 10;
  optional int32 max_concurrent_streams = 11;
  optional maxshot.common.v1.SearchPolicy search_policy = 12;
}

message ManagedApiKey {
  string api_key_id = 1;
  string label = 2;
  string masked_key = 3;
  ApiKeyPolicy policy = 4;
  int64 created_at_unix_ms = 5;
  int64 revoked_at_unix_ms = 6;
}

message CreateApiKeyRequest {
  string account_id = 1;
  string idempotency_key = 2;
  string label = 3;
  ApiKeyPolicy policy = 4;
}
message CreateApiKeyResponse {
  ManagedApiKey key = 1;
  string one_time_secret = 2; // Never returned by reads or logged.
}
message UpdateApiKeyRequest {
  string account_id = 1;
  string api_key_id = 2;
  string idempotency_key = 3;
  optional string label = 4;
  ApiKeyPolicy policy = 5;
  // Allowlisted policy field names to replace, including explicit clearing of repeated fields.
  repeated string policy_update_fields = 6;
}
message UpdateApiKeyResponse {
  ManagedApiKey key = 1;
}
message RevokeApiKeyRequest {
  string account_id = 1;
  string api_key_id = 2;
  string idempotency_key = 3;
}
message RevokeApiKeyResponse {
  ManagedApiKey key = 1;
}
message ListApiKeysRequest {
  string account_id = 1;
  maxshot.common.v1.CursorPageRequest page = 2;
}
message ListApiKeysResponse {
  repeated ManagedApiKey keys = 1;
  maxshot.common.v1.CursorPageResponse page = 2;
}

message AccountFundingSettings {
  optional bool web_dollar_relay_enabled = 1;
  optional bool allow_basic_to_premium = 2;
  optional bool allow_ait_earned_credit = 3;
  repeated maxshot.common.v1.BudgetPeriodRule spending_limits = 4;
}
message GetAccountFundingRequest {
  string account_id = 1;
}
message GetAccountFundingResponse {
  AccountFundingSettings settings = 1;
  repeated BucketBalanceView balances = 2;
