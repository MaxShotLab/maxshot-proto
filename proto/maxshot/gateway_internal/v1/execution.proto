service BillingAdminService {
  rpc CreatePlanDraft(CreatePlanDraftRequest) returns (CreatePlanDraftResponse);
  rpc ValidatePlanVersion(ValidatePlanVersionRequest) returns (ValidatePlanVersionResponse);
  rpc PreviewPlanImpact(PreviewPlanImpactRequest) returns (PreviewPlanImpactResponse);
  rpc PublishPlanVersion(PublishPlanVersionRequest) returns (PublishPlanVersionResponse);
  rpc SetPlanSalesStatus(SetPlanSalesStatusRequest) returns (SetPlanSalesStatusResponse);
  rpc SetSpendingLock(SetSpendingLockRequest) returns (SetSpendingLockResponse);
  rpc ManualLedgerAdjustment(ManualLedgerAdjustmentRequest) returns (ManualLedgerAdjustmentResponse);
  rpc ResolveDepositReorgHold(ResolveDepositReorgHoldRequest) returns (ResolveDepositReorgHoldResponse);
  rpc ReviewTopup(ReviewTopupRequest) returns (ReviewTopupResponse);
  rpc RevokeReferralReward(RevokeReferralRewardRequest) returns (RevokeReferralRewardResponse);
  rpc ResolveDiscrepancy(ResolveDiscrepancyRequest) returns (ResolveDiscrepancyResponse);
  rpc RefundSettledRequest(RefundSettledRequestRequest) returns (RefundSettledRequestResponse);
  rpc UpsertFundedTerm(UpsertFundedTermRequest) returns (UpsertFundedTermResponse);
  rpc LockFundedTerm(LockFundedTermRequest) returns (LockFundedTermResponse);
  rpc SetCoverageThrottlePolicy(SetCoverageThrottlePolicyRequest) returns (SetCoverageThrottlePolicyResponse);
  rpc UpdateSystemSetting(UpdateSystemSettingRequest) returns (UpdateSystemSettingResponse);
  rpc UpdateFreeModelQuotaPolicy(UpdateFreeModelQuotaPolicyRequest) returns (UpdateFreeModelQuotaPolicyResponse);
}

service StudioAdminService {
  rpc ResolveUncertainJob(ResolveUncertainJobRequest) returns (ResolveUncertainJobResponse);
  rpc ModerateMaterial(ModerateMaterialRequest) returns (ModerateMaterialResponse);
  rpc ResolveAppeal(ResolveAppealRequest) returns (ResolveAppealResponse);
}

enum OperatorAuthenticationMethod {
  OPERATOR_AUTHENTICATION_METHOD_UNSPECIFIED = 0;
  OPERATOR_AUTHENTICATION_METHOD_TOTP = 1;
  OPERATOR_AUTHENTICATION_METHOD_WALLET_SIGNATURE = 2;
}

message OperatorContext {
  string operator_id = 1;
  OperatorAuthenticationMethod authentication_method = 2;
  string reason = 3;
  string idempotency_key = 4;
  string source_ip = 5;
  int64 step_up_verified_at_unix_ms = 6;
  // Audit reference to the method- and target-bound step-up, never the TOTP code or wallet signature.
  string step_up_proof_ref = 7;
}

message AdminMutationResult {
  string audit_id = 1;
  string resource_id = 2;
  string status = 3;
}

message PlanCostValidation {
  string catalog_version = 1;
  int64 basic_worst_cost_micro_usd = 2;
  int64 premium_worst_cost_micro_usd = 3;
  int64 minimum_contribution_micro_usd = 4;
  repeated string violations = 5;
}
message CreatePlanDraftRequest {
  OperatorContext operator = 1;
  SubscriptionPlanVersion plan = 2;
}
message CreatePlanDraftResponse {
  AdminMutationResult result = 1;
}
message ValidatePlanVersionRequest {
  string version_id = 1;
}
message ValidatePlanVersionResponse {
  PlanCostValidation validation = 1;
}
message PreviewPlanImpactRequest {
  string version_id = 1;
}
message PreviewPlanImpactResponse {
  int64 affected_subscriptions = 1;
  repeated string adverse_changes = 2;
  PlanCostValidation validation = 3;
}
message PublishPlanVersionRequest {
  OperatorContext operator = 1;
  string version_id = 2;
  string expected_catalog_version = 3;
}
message PublishPlanVersionResponse {
  AdminMutationResult result = 1;
}
message SetPlanSalesStatusRequest {
  OperatorContext operator = 1;
  string version_id = 2;
  string sales_status = 3;
}
message SetPlanSalesStatusResponse {
  AdminMutationResult result = 1;
}

message SetSpendingLockRequest {
  OperatorContext operator = 1;
  string account_id = 2;
  bool locked = 3;
}
message SetSpendingLockResponse {
  AdminMutationResult result = 1;
}
message ManualLedgerAdjustmentRequest {
  OperatorContext operator = 1;
  string account_id = 2;
  maxshot.common.v1.FundingBucket funding_bucket = 3;
  string source_id = 4;
  int64 credit_delta = 5;
  int64 dollar_delta_micro_usd = 6;
}
message ManualLedgerAdjustmentResponse {
  AdminMutationResult result = 1;
}
message ResolveDepositReorgHoldRequest {
