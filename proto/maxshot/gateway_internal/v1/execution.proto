  string reward_id = 2;
}
message RevokeReferralRewardResponse {
  AdminMutationResult result = 1;
}
message ResolveDiscrepancyRequest {
  OperatorContext operator = 1;
  string discrepancy_id = 2;
  string disposition = 3;
}
message ResolveDiscrepancyResponse {
  AdminMutationResult result = 1;
}
message RefundSettledRequestRequest {
  OperatorContext operator = 1;
  string request_id = 2;
}
message RefundSettledRequestResponse {
  AdminMutationResult result = 1;
}

message UpsertFundedTermRequest {
