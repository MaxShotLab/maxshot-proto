syntax = "proto3";

package maxshot.contract_grant.v1;

import "maxshot/common/v1/types.proto";

option go_package = "github.com/MaxShotLab/maxshot-proto/gen/go/maxshot/contract_grant/v1;contractgrantv1";

// ContractBackendService is hosted by Contract Backend and called by Gateway Backend
// over WireGuard + TLS + HMAC. Services are cleanly split by hosting side for strict method ACLs.
service ContractBackendService {
  // PushFundedTerms pushes approved, reserve-backed FundedTerm configurations from Gateway Billing (authoritative owner) to Contract Backend.
  rpc PushFundedTerms(PushFundedTermsRequest) returns (PushFundedTermsResponse);

  // PushWalletEligibility pushes verified 1:1 SIWE/ERC-1271 wallet bindings and Funded Term acceptances from Gateway to Contract Backend.
  rpc PushWalletEligibility(PushWalletEligibilityRequest) returns (PushWalletEligibilityResponse);

  // GetContractOperationalStatus fetches read-only pause flags, finalized chain sync height, and global token/staking metrics for Gateway Admin (ADM-R22, ADM-R23, XCT-R11).
  rpc GetContractOperationalStatus(GetContractOperationalStatusRequest) returns (GetContractOperationalStatusResponse);

  // GetAccountStakingSummary fetches per-account, per-term/boundary eligible AIT-wei-seconds, cumulative entitlements, and lock positions (ADM-R20, ADM-R21).
  rpc GetAccountStakingSummary(GetAccountStakingSummaryRequest) returns (GetAccountStakingSummaryResponse);
}

// AitCreditGrantService is hosted by Gateway Billing and called by Contract Backend
// over WireGuard + TLS + HMAC for startup/reconnect state catch-up and 7-day boundary Credit grants.
service AitCreditGrantService {
  // ListFundedTerms lets Contract Backend pull authoritative FundedTerm configurations on startup or reconnect.
  rpc ListFundedTerms(ListFundedTermsRequest) returns (ListFundedTermsResponse);

  // PullWalletEligibilityUpdates lets Contract Backend catch up on wallet bindings and term acceptances by cursor.
  rpc PullWalletEligibilityUpdates(PullWalletEligibilityUpdatesRequest) returns (PullWalletEligibilityUpdatesResponse);

  // IssueAitCreditGrants validates and posts 7-day expiring AIT Earned Credit staking grants (TOK-R24, TOK-R25, TOK-R31).
  // Note: Settled-charge AIT refunds (BIL-R42) are issued locally inside Gateway Billing against its independent Refund Reserve
  // and never pass through this staking-grant endpoint or Tokenomics 12-week staking grant history.
  rpc IssueAitCreditGrants(IssueAitCreditGrantsRequest) returns (IssueAitCreditGrantsResponse);
}

enum FundedTermStatus {
  FUNDED_TERM_STATUS_UNSPECIFIED = 0;
  FUNDED_TERM_STATUS_UPCOMING = 1;
  FUNDED_TERM_STATUS_ACTIVE = 2;
  FUNDED_TERM_STATUS_ENDED = 3;
  FUNDED_TERM_STATUS_HALTED_COVERAGE_BREACH = 4; // TOK-R30: blocks uncovered future grants
}

enum GrantItemStatus {
  GRANT_ITEM_STATUS_UNSPECIFIED = 0;
  GRANT_ITEM_STATUS_CREDITED = 1;
  GRANT_ITEM_STATUS_ALREADY_CREDITED = 2; // idempotent replay
  GRANT_ITEM_STATUS_REJECTED_UNLINKED_WALLET = 3;
  GRANT_ITEM_STATUS_REJECTED_TERMS_NOT_ACCEPTED = 4;
  GRANT_ITEM_STATUS_REJECTED_FORMULA_MISMATCH = 5;
  GRANT_ITEM_STATUS_REJECTED_RESERVE_EXCEEDED = 6;
  GRANT_ITEM_STATUS_REJECTED_EXCLUDED_WALLET = 7;
  GRANT_ITEM_STATUS_REJECTED_COVERAGE_BREACH = 8;
}

// AitCoverageThrottlePolicy implements TD-64 prospective high-cost model throttling during coverage breach
// without mutating FundedTermConfig.allowed_catalog_ids, credit rate, or duration.
message AitCoverageThrottlePolicy {
  bool throttle_active = 1;
  repeated string restricted_customer_model_ids = 2;
  string max_allowed_model_rate_usd_dec = 3;
  string reason = 4;
  int64 updated_at_unix_sec = 5;
}

// FundedTermConfig is authored and reserve-locked in Gateway Billing (ADM-R19 / TOK-R23)
// and replicated to Contract Backend. The rational N/D rate converts USD face value to integer Credits
// at grant issuance time only; spending uses the unified Gateway ledger Credit unit.
message FundedTermConfig {
  string term_id = 1;
  string program_id = 2;
  string funding_reservation_id = 3;
  string terms_version = 4;
  int64 start_unix_sec = 5;
  int64 end_unix_sec = 6;
  int64 annual_base_usd_num = 7;     // decided: 12 (TD-77)
  int64 annual_base_usd_den = 8;     // decided: 1
  int64 credits_per_usd_num = 9;     // decided: 1000000 (TD-53), issuance conversion only
  int64 credits_per_usd_den = 10;    // decided: 1
  repeated string allowed_catalog_ids = 11;
  int64 max_total_grant_credits = 12;
  FundedTermStatus status = 13;
  int64 updated_at_unix_sec = 14;
  AitCoverageThrottlePolicy coverage_throttle_policy = 15;
}

message PushFundedTermsRequest {
  string batch_id = 1;
  repeated FundedTermConfig terms = 2;
}

message PushFundedTermsResponse {
  bool accepted = 1;
}

message ListFundedTermsRequest {
  bool active_or_upcoming_only = 1;
}

message ListFundedTermsResponse {
  repeated FundedTermConfig terms = 1;
}

message TermAcceptance {
  string term_id = 1;
  string terms_version = 2;
  int64 accepted_at_unix_sec = 3;
}

message WalletEligibilityRecord {
  string account_id = 1;
  string wallet_address = 2; // normalized lowercase 0x-prefixed Ethereum address
  uint64 chain_id = 3;       // 1 (Ethereum mainnet)
  int64 linked_at_unix_sec = 4;
  string siwe_proof_ref = 5; // audit proof reference for ADM-R21
  bool is_contract_wallet_erc1271 = 6;
  bool excluded_treasury_or_team = 7; // TOK-R36
  repeated TermAcceptance term_acceptances = 8;
  int64 updated_sequence = 9;
}

message PushWalletEligibilityRequest {
  string batch_id = 1;
  repeated WalletEligibilityRecord records = 2;
}

message PushWalletEligibilityResponse {
  bool accepted = 1;
  int64 highest_sequence = 2;
}

message PullWalletEligibilityUpdatesRequest {
  maxshot.common.v1.CursorPageRequest page = 1;
}

message PullWalletEligibilityUpdatesResponse {
  repeated WalletEligibilityRecord records = 1;
  maxshot.common.v1.CursorPageResponse page = 2;
}

message DirectedBridgeRoutePause {
  uint32 src_chain_eid = 1;
  uint32 dst_chain_eid = 2;
  bool paused = 3;
}

message GetContractOperationalStatusRequest {}

// GetContractOperationalStatusResponse feeds Gateway Admin read-only pause, finality, and token/staking monitoring (ADM-R22, ADM-R23, TOK-R05, XCT-R11).
message GetContractOperationalStatusResponse {
  bool mint_paused = 1;
  bool burn_paused = 2;
  bool withdraw_paused = 3;
  bool position_pause_all = 4;
  bool max_bridge_global_paused = 5;
  repeated DirectedBridgeRoutePause directed_bridge_pauses = 6;
  uint64 ethereum_head_block = 7;
  uint64 ethereum_finalized_block = 8;
  int64 ethereum_finalized_timestamp_unix_sec = 9;
  string active_term_id = 10;
  int64 next_grant_boundary_unix_sec = 11;
  string outstanding_ait_wei_dec = 12;
  string high_water_mark_ait_wei_dec = 13;
  string total_staked_ait_wei_dec = 14;
  string total_locked_max_wei_dec = 15;
  string total_pending_max_wei_dec = 16;
  uint64 latest_finalized_block_number = 17;
}

message GetAccountStakingSummaryRequest {
  string account_id = 1;
  string wallet_address = 2;
  string term_id = 3; // optional filter; empty returns active and recent terms
}

message AccountTermBoundaryRecord {
  string term_id = 1;
  int32 boundary_index = 2;
  string eligible_ait_wei_seconds_dec = 3;
  int64 cumulative_entitlement_credits = 4;
  int64 cumulative_granted_credits = 5;
  int64 boundary_grant_credits = 6;
  string grant_id = 7;
  int64 boundary_end_unix_sec = 8;
}

message GetAccountStakingSummaryResponse {
  string account_id = 1;
  repeated string bound_wallet_addresses = 2;
  string active_staked_ait_wei_dec = 3;
  string active_locked_max_wei_dec = 4;
  string pending_unlock_max_wei_dec = 5;
  repeated AccountTermBoundaryRecord boundary_records = 6;
}

message BoundaryBatchSummary {
  int32 batch_sequence = 1; // 1-based batch index within (term_id, boundary_index)
  int32 total_batches = 2;
  int64 boundary_total_grant_credits = 3;
  string boundary_total_eligible_ait_wei_seconds_dec = 4;
  string onchain_total_staked_ait_wei_dec = 5; // feeds 7-day boundary read-only RPC invariant check (§3.3.4)
  uint64 finalized_block_number = 6;
  string finalized_block_hash = 7;
  int64 boundary_start_unix_sec = 8;
  int64 boundary_end_unix_sec = 9;
}

message AitGrantItem {
  string grant_id = 1; // deterministic: "{term_id}:{boundary_index}:{account_id}"
  string term_id = 2;
  int32 boundary_index = 3;
  string account_id = 4;
  string wallet_address = 5;
  // Exact 256-bit integer decimal string: eligible staked AIT wei * eligible seconds from term start to boundary t.
  string cumulative_eligible_ait_wei_seconds_dec = 6;
  int64 previously_granted_credits = 7;
  int64 grant_credits = 8;
  uint64 finalized_block_number = 9;
  int64 boundary_timestamp_unix_sec = 10;
  string program_id = 11;
  string funding_reservation_id = 12;
  bool is_final_short_boundary = 13;
  int64 cumulative_entitlement_credits = 14;
  string finalized_block_hash = 15;
}

message IssueAitCreditGrantsRequest {
  string batch_id = 1;
  string term_id = 2;
  int32 boundary_index = 3;
  repeated AitGrantItem items = 4;
  BoundaryBatchSummary boundary_summary = 5;
}

message AitGrantItemResult {
  string grant_id = 1;
  GrantItemStatus status = 2;
  string detail = 3;
  int64 credited_amount = 4;
  int64 issued_at_unix_sec = 5;
  int64 expires_at_unix_sec = 6; // issued_at_unix_sec + 7 days (TOK-R24)
}

message IssueAitCreditGrantsResponse {
  repeated AitGrantItemResult results = 1;
}
