version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-ts_proto
    out: gen/ts
    opt:
      - env=node
      - outputServices=grpc-js
      - esModuleInterop=true
      - forceLong=bigint
      - useOptionals=messages
      - importSuffix=.js
